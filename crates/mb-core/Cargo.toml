[package]
name = "mb-core"
version = "0.1.0"
edition = "2018"

[dependencies]
anyhow = "1.0.65"
byteorder = "1.4.3"
num_enum = "0.7.0"
thiserror = "1.0.37"
rand = "0.8.5"
ref-cast = "1.0.9"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
