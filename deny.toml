# `cargo deny check licenses` (CI): every dependency must be usable under the licenses that
# packaging/windows/NOTICE.txt names. Adding a license here means updating that notice too.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
]
exceptions = [
    # Unicode data tables. Only proc-macros use it at build time; it is not part of the exe.
    { allow = ["Unicode-DFS-2016"], crate = "unicode-ident" },
]
