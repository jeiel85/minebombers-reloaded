name: Release (Windows)

# Pushing a tag like v0.1.0 builds the Windows x64 zip and publishes it as a GitHub pre-release.
# Pull requests that touch the packaging only build the zip and keep it as a workflow artifact (nothing is
# published), so a broken release is found before the tag. The zip contains no original Mine Bombers files.
# A tag is published only when its commit is on main and the CI run of that commit passed.

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".cargo/config.toml"
      - "build.rs"
      - "scripts/package_windows.ps1"
      - "scripts/check_windows_imports.ps1"
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  windows:
    name: Windows x64 zip
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check that the tag is on main and its CI run passed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag ${{ github.ref_name }} ($sha) is not on main. Tag a commit that is on main." }
          $passed = [int](gh run list --workflow ci.yml --commit $sha --status success --json databaseId --jq 'length')
          if ($passed -lt 1) { throw "No passing CI run for $sha. Wait for the CI run of that commit on main to pass, then re-run this workflow." }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $crate = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($crate -ne $tag) { throw "Tag v$tag does not match Cargo.toml version $crate" }

      - name: Build
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_PATH "$PWD"
          Add-Content $env:GITHUB_PATH "$PWD\lib"
          cargo build --release --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - name: Check that the exe only needs bundled DLLs and Windows
        shell: pwsh
        run: |
          $stage = Get-ChildItem dist -Directory | Select-Object -First 1
          $dlls = (Get-ChildItem $stage.FullName -Filter *.dll).Name
          foreach ($file in @("MineBombers.exe") + $dlls) {
            ./scripts/check_windows_imports.ps1 -Exe (Join-Path $stage.FullName $file) -Bundled $dlls
          }

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: dist/*.zip*

      - name: Publish the pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Windows 64-bit build of the native engine. Unzip anywhere, run ``MineBombers.exe``, and pick the folder with your own copy of Mine Bombers 3.11 when asked (the zip contains no original game files; see README.txt inside).

          - Pre-release: the code license of this project is not settled yet (see NOTICE.txt).
          - The exe is not code-signed, so Windows SmartScreen may warn on first run ("More info" -> "Run anyway").
          - Verify the download with the ``.sha256`` file.
          - Only Windows has been run and checked. There is no Linux build here.
          "@
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.zip*).FullName --title "Mine Bombers: Reloaded ${{ github.ref_name }}" --notes $notes --prerelease --verify-tag
