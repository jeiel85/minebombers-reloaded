name: Deploy WebAssembly to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Test
        run: |
          cargo test -p mb-core -p mb-wasm
          node --test web/test/*.test.mjs

      - name: Build WebAssembly Crate
        run: |
          cargo build -p mb-wasm --target wasm32-unknown-unknown --release
          mkdir -p web/pkg
          cp target/wasm32-unknown-unknown/release/mb_wasm.wasm web/pkg/mb_wasm.wasm

      - name: Stage original game files (copied unmodified, not embedded in the wasm)
        run: node scripts/stage_web_data.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
